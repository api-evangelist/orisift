aid: orisift

name: Orisift

image: https://orisift.com/opengraph-image?0bbf128a9b71721e

description: Orisift provides a unified validation API for phone numbers, email addresses, IP addresses, and domain information. The service offers
  format checking, numbering plan verification, reserved and fictional range detection for phone numbers, as well as MX, Null MX, SPF, and DMARC
  checks for email domains. It returns detailed evidence and risk signals, supporting agencies and developers in data quality and compliance workflows.
  The platform delivers a single endpoint with credit‑based usage, allowing free trial credits and paid plans for higher volume.

